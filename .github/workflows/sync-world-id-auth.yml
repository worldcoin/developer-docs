name: Sync IDP docs

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "temporal-apps branch, tag, or commit to publish for review"
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: sync-world-id-auth
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'worldcoin/developer-docs' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: developer-docs
    steps:
      - name: Check publishing credentials
        working-directory: ${{ github.workspace }}
        env:
          APP_ID: ${{ vars.IDP_DOCS_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.IDP_DOCS_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::error::Configure IDP_DOCS_APP_ID and IDP_DOCS_APP_PRIVATE_KEY before running IDP publishing."
            exit 1
          fi

      - name: Check out publishing code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: developer-docs
          persist-credentials: false

      - name: Create read-only source token
        id: source-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.IDP_DOCS_APP_ID }}
          private-key: ${{ secrets.IDP_DOCS_APP_PRIVATE_KEY }}
          owner: worldcoin
          repositories: temporal-apps
          permission-contents: read

      - name: Check out canonical guides
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: worldcoin/temporal-apps
          ref: ${{ inputs.source_ref || 'main' }}
          token: ${{ steps.source-token.outputs.token }}
          path: _source/temporal-apps
          persist-credentials: false
          sparse-checkout: |
            apps/idpapi/mcp/guides

      - name: Record guide commit and publishing branch
        id: source
        env:
          SOURCE_REF: ${{ inputs.source_ref || 'main' }}
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
        run: |
          source_sha=$(git -C ../_source/temporal-apps rev-parse HEAD)
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The source checkout did not resolve to a full commit SHA."
            exit 1
          fi
          guide_sha=$(gh api --method GET /repos/worldcoin/temporal-apps/commits \
            -f sha="$source_sha" \
            -f path=apps/idpapi/mcp/guides \
            -f per_page=1 \
            --jq '.[0].sha')
          if [[ ! "$guide_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve the latest guide-changing commit for the source checkout."
            exit 1
          fi
          publishing_branch=codex/sync-world-id-auth
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$SOURCE_REF" != main ] && [ "$SOURCE_REF" != refs/heads/main ]; then
            publishing_branch="codex/sync-world-id-auth-manual-$source_sha"
          fi
          echo "sha=$guide_sha" >> "$GITHUB_OUTPUT"
          echo "branch=$publishing_branch" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1

      - name: Generate pages
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
        run: node scripts/sync-world-id-auth.mjs --source-dir ../_source/temporal-apps --source-commit "$SOURCE_COMMIT"

      - name: Check generated output
        timeout-minutes: 2
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
        run: |
          node scripts/sync-world-id-auth.mjs --source-dir ../_source/temporal-apps --source-commit "$SOURCE_COMMIT" --check
          node --test scripts/sync-world-id-auth.test.mjs
          git diff --check -- agent-pass .mintlify/world-id-auth-source.json

      - name: Create publishing token
        id: docs-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.IDP_DOCS_APP_ID }}
          private-key: ${{ secrets.IDP_DOCS_APP_PRIVATE_KEY }}
          owner: worldcoin
          repositories: developer-docs
          permission-contents: write
          permission-pull-requests: write

      - name: Open or update publishing PR
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ steps.docs-token.outputs.token }}
          path: developer-docs
          base: main
          branch: ${{ steps.source.outputs.branch }}
          commit-message: sync IDP docs
          title: sync IDP docs
          draft: true
          add-paths: |
            agent-pass/*.mdx
            .mintlify/world-id-auth-source.json
          body: |
            ## Summary
            - Publish canonical guides from [temporal-apps](https://github.com/worldcoin/temporal-apps/tree/${{ steps.source.outputs.sha }}/apps/idpapi/mcp/guides).
            - Review content and release status before merging. This PR does not deploy Auth or change MCP access controls.

            ## Testing
            - Passed: publisher tests, deterministic regeneration check, and `git diff --check`.
            - Not run: full Mintlify build.
